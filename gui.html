<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MQTT Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            padding: 20px;
            color: #e2e8f0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(30, 41, 59, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(71, 85, 105, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            color: #f1f5f9;
            padding: 30px;
            text-align: center;
            position: relative;
            border-bottom: 1px solid rgba(71, 85, 105, 0.3);
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(15, 23, 42, 0.6);
            padding: 10px 20px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
            margin-top: 15px;
            border: 1px solid rgba(71, 85, 105, 0.3);
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-dot.connected {
            background: #22c55e;
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.5);
        }

        .status-dot.disconnected {
            background: #ef4444;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 30px;
            padding: 30px;
            min-height: 600px;
        }

        .messages-section {
            background: rgba(15, 23, 42, 0.8);
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(71, 85, 105, 0.3);
            overflow: hidden;
        }

        .section-header {
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            color: #f1f5f9;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(71, 85, 105, 0.3);
        }

        .section-header h2 {
            font-size: 1.5rem;
            color: #60a5fa;
        }

        .refresh-btn {
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #60a5fa;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .refresh-btn:hover {
            background: rgba(59, 130, 246, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.2);
        }

        .messages-container {
            max-height: 500px;
            overflow-y: auto;
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
        }

        .messages-container::-webkit-scrollbar {
            width: 8px;
        }

        .messages-container::-webkit-scrollbar-track {
            background: rgba(71, 85, 105, 0.2);
            border-radius: 4px;
        }

        .messages-container::-webkit-scrollbar-thumb {
            background: rgba(71, 85, 105, 0.5);
            border-radius: 4px;
        }

        .messages-container::-webkit-scrollbar-thumb:hover {
            background: rgba(71, 85, 105, 0.7);
        }

        .message-item {
            background: rgba(30, 41, 59, 0.8);
            border-left: 4px solid #3b82f6;
            margin-bottom: 15px;
            padding: 15px;
            border-radius: 8px;
            transition: all 0.3s ease;
            animation: slideIn 0.5s ease;
            border: 1px solid rgba(71, 85, 105, 0.2);
        }

        .message-item:hover {
            background: rgba(30, 41, 59, 0.95);
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            border-left-color: #60a5fa;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-topic {
            font-weight: bold;
            color: #60a5fa;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .message-payload {
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            border: 1px solid rgba(71, 85, 105, 0.3);
            margin: 8px 0;
            word-break: break-all;
            color: #cbd5e1;
        }

        .message-payload pre {
            color: #e2e8f0;
            white-space: pre-wrap;
        }

        .message-payload table {
            color: #e2e8f0;
            background: rgba(15, 23, 42, 0.5);
        }

        .message-payload table th {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            padding: 8px;
        }

        .message-payload table td {
            padding: 6px 8px;
            border-color: rgba(71, 85, 105, 0.3);
        }

        .message-meta {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            font-size: 12px;
            color: #94a3b8;
            margin-top: 8px;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .publish-section {
            background: rgba(15, 23, 42, 0.8);
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(71, 85, 105, 0.3);
            overflow: hidden;
        }

        .form-container {
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #cbd5e1;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid rgba(71, 85, 105, 0.5);
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
            background: rgba(15, 23, 42, 0.8);
            color: #e2e8f0;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .form-group select option {
            background: #1e293b;
            color: #e2e8f0;
        }

        .publish-btn {
            width: 100%;
            background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .publish-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
        }

        .publish-btn:disabled {
            background: #475569;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .stats-section {
            background: rgba(15, 23, 42, 0.8);
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(71, 85, 105, 0.3);
            padding: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }

        .stat-item {
            text-align: center;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            border: 1px solid rgba(71, 85, 105, 0.2);
            transition: all 0.3s ease;
        }

        .stat-item:hover {
            background: rgba(0, 0, 0, 0.4);
            transform: translateY(-2px);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #60a5fa;
            text-shadow: 0 0 10px rgba(96, 165, 250, 0.3);
        }

        .stat-label {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 5px;
        }

        .no-messages {
            text-align: center;
            color: #94a3b8;
            font-style: italic;
            padding: 40px;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #475569;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .success-message,
        .error-message {
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            font-size: 14px;
        }

        .success-message {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .error-message {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>🚀 MQTT Dashboard</h1>
            <div class="status-indicator">
                <div class="status-dot disconnected" id="statusDot"></div>
                <span id="statusText">Checking connection...</span>
            </div>
        </div>

        <div class="main-content">
            <div class="messages-section">
                <div class="section-header">
                    <h2>📬 Messages</h2>
                    <div>
                        <button class="refresh-btn" onclick="refreshMessages()">
                            <span id="refreshIcon">🔄</span> Refresh
                        </button>
                        <button class="refresh-btn" onclick="toggleView()" id="viewToggle">
                            📋 JSON View
                        </button>
                    </div>
                </div>

                <div class="messages-container" id="messagesContainer">
                    <div class="no-messages">Loading messages...</div>
                </div>
            </div>

            <div class="sidebar">
               
                <div class="stats-section">
                    <div class="section-header">
                        <h2>📊 Statistics</h2>
                    </div>
                    <div class="stats-grid">
                        <div class="stat-item">
                            <div class="stat-value" id="totalMessages">0</div>
                            <div class="stat-label">Total Messages</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="detectionMessages">0</div>
                            <div class="stat-label">Detections</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="testMessages">0</div>
                            <div class="stat-label">Test Messages</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="lastUpdate">Never</div>
                            <div class="stat-label">Last Update</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let messages = [];
        let autoRefresh = true;
        let viewMode = "csv"; // default to CSV view

        function toggleView() {
            viewMode = viewMode === "csv" ? "json" : "csv";
            document.getElementById("viewToggle").textContent = viewMode === "csv" ? "📋 JSON View" : "📊 CSV View";
            updateUI(); // re-render messages
        }

        // Configuration - Update these URLs to match your Flask server
        const API_BASE = 'http://localhost:5000';  // Change this to your Flask server URL
        const STATUS_URL = `${API_BASE}/api/status`;
        const PUBLISH_URL = `${API_BASE}/api/publish_detection`;

        async function fetchMessages() {
            try {
                const response = await fetch(STATUS_URL);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

                const data = await response.json();
                messages = data.messages || [];
                updateUI();
                updateConnectionStatus(true);
            } catch (error) {
                console.error('Error fetching messages:', error);
                updateConnectionStatus(false);
                showError('Failed to fetch messages. Check if Flask server is running.');
            }
        }

        function updateUI() {
            const container = document.getElementById('messagesContainer');

            if (messages.length === 0) {
                container.innerHTML = '<div class="no-messages">No messages received yet</div>';
                return;
            }

            // Sort messages by timestamp (newest first)
            const sortedMessages = [...messages].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

            container.innerHTML = sortedMessages.map(msg => {
                let parsedPayload = msg.payload;
                try {
                    const parsed = JSON.parse(msg.payload);
                    if (viewMode === "json") {
                        parsedPayload = `<pre>${JSON.stringify(parsed, null, 2)}</pre>`;
                    } else {
                        parsedPayload = renderCSV(parsed);
                    }
                } catch (e) {
                    parsedPayload = msg.payload;
                }

                return `
                    <div class="message-item">
                        <div class="message-topic">📡 ${msg.topic}</div>
                        <div class="message-payload">${parsedPayload}</div>
                        <div class="message-meta">
                            <span>🕐 ${formatTimestamp(msg.timestamp)}</span>
                            <span>📊 QoS: ${msg.qos || 0}</span>
                        </div>
                    </div>
                `;
            }).join('');

            updateStats();
        }

        function updateStats() {
            const total = messages.length;
            const detections = messages.filter(msg => msg.topic === 'detection/results').length;
            const testMsgs = messages.filter(msg => msg.topic === 'test/topic').length;
            const lastUpdate = messages.length > 0 ? formatTimestamp(Math.max(...messages.map(msg => new Date(msg.timestamp)))) : 'Never';

            document.getElementById('totalMessages').textContent = total;
            document.getElementById('detectionMessages').textContent = detections;
            document.getElementById('testMessages').textContent = testMsgs;
            document.getElementById('lastUpdate').textContent = lastUpdate;
        }

        function updateConnectionStatus(connected) {
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');

            if (connected) {
                statusDot.className = 'status-dot connected';
                statusText.textContent = 'Connected to MQTT';
            } else {
                statusDot.className = 'status-dot disconnected';
                statusText.textContent = 'Disconnected';
            }
        }

        function formatTimestamp(timestamp) {
            try {
                return new Date(timestamp).toLocaleString();
            } catch (e) {
                return timestamp;
            }
        }

        async function refreshMessages() {
            const refreshIcon = document.getElementById('refreshIcon');
            refreshIcon.innerHTML = '<div class="loading"></div>';

            await fetchMessages();

            setTimeout(() => {
                refreshIcon.textContent = '🔄';
            }, 500);
        }

        async function publishDetection(data) {
            try {
                const response = await fetch(PUBLISH_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });

                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

                const result = await response.json();
                return { success: true, data: result };
            } catch (error) {
                console.error('Error publishing detection:', error);
                return { success: false, error: error.message };
            }
        }

        function showSuccess(message) {
            const resultDiv = document.getElementById('publishResult');
            resultDiv.innerHTML = `<div class="success-message">✅ ${message}</div>`;
            setTimeout(() => resultDiv.innerHTML = '', 5000);
        }

        function showError(message) {
            const resultDiv = document.getElementById('publishResult');
            resultDiv.innerHTML = `<div class="error-message">❌ ${message}</div>`;
            setTimeout(() => resultDiv.innerHTML = '', 5000);
        }

        function renderCSV(data) {
            if (!data || typeof data !== "object") return "<i>Invalid payload</i>";

            // Case 1: Raw Dough
            if ("number_of_defected" in data && "number_of_good" in data) {
                return `
        <table border="1" style="border-collapse: collapse; width:100%; font-size:12px;">
            <tr><th>Tray</th><th>Good</th><th>Defected</th><th>Missing</th><th>Total</th></tr>
            <tr>
                <td>${data.tray_number}</td>
                <td>${data.number_of_good}</td>
                <td>${data.number_of_defected}</td>
                <td>${data.number_of_missing}</td>
                <td>${data.total_detected}</td>
            </tr>
        </table>`;
            }

            // Case 2: Baked Baguette
            if ("good" in data && "defected" in data) {
                return `
        <table border="1" style="border-collapse: collapse; width:100%; font-size:12px;">
            <tr><th>Tray</th><th>Good</th><th>Acceptable</th><th>Defected</th><th>Total</th></tr>
            <tr>
                <td>${data.tray_number}</td>
                <td>${data.good}</td>
                <td>${data.acceptable}</td>
                <td>${data.defected}</td>
                <td>${data.total_detected}</td>
            </tr>
        </table>`;
            }

            // Case 3: Donuts
            if ("doughnuts" in data) {
                return `
        <table border="1" style="border-collapse: collapse; width:100%; font-size:12px;">
            <tr><th>Row</th><th>Doughnut #</th><th>Status</th><th>Measurement Diff</th></tr>
            ${data.doughnuts.map(d => `
                <tr>
                    <td>${data.row_number}</td>
                    <td>${d.doughnut_number}</td>
                    <td>${d.status}</td>
                    <td>${d.measurement_difference}</td>
                </tr>
            `).join("")}
        </table>`;
            }

            // Fallback to JSON view
            return `<pre>${JSON.stringify(data, null, 2)}</pre>`;
        }

        // Event Listeners
        document.getElementById('publishForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const objectType = document.getElementById('objectType').value;
            const confidence = parseFloat(document.getElementById('confidence').value);

            if (!objectType || isNaN(confidence)) {
                showError('Please fill in all fields correctly');
                return;
            }

            const publishBtn = document.getElementById('publishBtn');
            publishBtn.disabled = true;
            publishBtn.innerHTML = '<div class="loading"></div> Publishing...';

            const detectionData = {
                object: objectType,
                confidence: confidence,
                timestamp: new Date().toISOString()
            };

            const result = await publishDetection(detectionData);

            publishBtn.disabled = false;
            publishBtn.innerHTML = '📡 Publish Detection';

            if (result.success) {
                showSuccess(`Detection published successfully! Object: ${objectType}, Confidence: ${confidence}`);
                document.getElementById('publishForm').reset();
                // Refresh messages after a short delay to see the published message
                setTimeout(fetchMessages, 1000);
            } else {
                showError(`Failed to publish: ${result.error}`);
            }
        });

        // Auto-refresh every 3 seconds
        setInterval(() => {
            if (autoRefresh) {
                fetchMessages();
            }
        }, 3000);

        // Initial load
        fetchMessages();

        // Handle page visibility change to pause/resume auto-refresh
        document.addEventListener('visibilitychange', () => {
            autoRefresh = !document.hidden;
        });
    </script>
</body>

</html>
